<style>
/* Password page. Light/dark like the demo; one centred column. */
:root { --bg: #f0ebe0; --card: #ffffff; --line: rgba(38,30,20,0.16); --text: #211a12; --text-2: rgba(38,30,20,0.7); --brass: #a97a1e; --cta: #241c11; --cta-text: #f8f0dc; --err: #a3321f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #080706; --card: #15110b; --line: rgba(244,236,224,0.16); --text: #fbf6ec; --text-2: rgba(244,236,224,0.62); --brass: #e0a33e; --cta: #e0a33e; --cta-text: #19120a; --err: #f08a73; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #080706; --card: #15110b; --line: rgba(244,236,224,0.16); --text: #fbf6ec; --text-2: rgba(244,236,224,0.62); --brass: #e0a33e; --cta: #e0a33e; --cta-text: #19120a; --err: #f08a73; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Avenir Next", system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 360px; display: grid; gap: 14px; text-align: center; }
.mark { font-weight: 800; letter-spacing: .24em; font-size: 13px; color: var(--brass); }
h1 { margin: 4px 0 0; font-size: 24px; font-weight: 800; }
p { margin: 0; color: var(--text-2); font-size: 14px; }
input[type=password] { width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 17px; padding: 0 14px; text-align: center; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button { height: 52px; border: 0; border-radius: 12px; background: var(--cta); color: var(--cta-text); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
button[disabled] { opacity: .55; cursor: default; }
.rm { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--text-2); }
.err { min-height: 18px; font-size: 13px; color: var(--err); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <form id="f" autocomplete="off">
    <div class="mark">BARLINK</div>
    <h1>Demo privada</h1>
    <p>Introduce la contraseña para ver la demo.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
    <label class="rm"><input id="rm" type="checkbox" checked> Recordar en este dispositivo</label>
    <button id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

  var subtle = window.crypto && window.crypto.subtle;
  function $(id) { return document.getElementById(id); }
  function fromB64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function toB64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function dec(key, buf) { return subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12)); }
  function derive(pw) {
    return subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {

  }
  function busy(text) { $("go").disabled = true; $("go").textContent = text; }
  function idle() { $("go").disabled = false; $("go").textContent = "Entrar"; }

  function unlock(key, remember) {
    return dec(key, fromB64(PAYLOAD)).then(function (plain) {
      var data = JSON.parse(new TextDecoder().decode(plain));
      if (remember) subtle.exportKey("raw", key).then(function (raw) { try { localStorage.setItem(KEY_ID, toB64(new Uint8Array(raw))); } catch (e) {} });

      busy("Cargando fotos…");
      return Promise.all(paths.map(function (p) {
        var m = data.map[p];
        return fetch(m.f).then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); })
          .then(function (ab) { return dec(key, new Uint8Array(ab)); })
          .then(function (img) { urls[p] = URL.createObjectURL(new Blob([img], { type: m.t })); done++; $("go").textContent = "Cargando fotos " + done + "/" + paths.length; })

        var html = data.html.replace("/*__IMGMAP__*/null", JSON.stringify(urls));

      });

  try { saved = localStorage.getItem(KEY_ID); } catch (e) {}
